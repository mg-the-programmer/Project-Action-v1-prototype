[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-kb"
version = "0.1.0"
description = "Personal knowledge base ingestion and retrieval service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<1",
  "langsmith>=0.7,<1",
  "mcp>=1.26,<2",
  "openai>=2.24,<3",
  "pytest>=9.0,<10",
  "supabase>=2.28,<3",
  "uvicorn>=0.40,<1",
]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
markers = ["integration: exercises the configured Supabase database; tests clean up any isolated fixtures"]
